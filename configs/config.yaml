# Load Balancer Configuration
# ===========================
#
# This is the default configuration for development.
# Production deployments should tune timeouts based on workload characteristics.

server:
  # Port the load balancer listens on.
  port: 8080

  # Maximum duration for reading the entire request, including body.
  read_timeout: 15s

  # Maximum duration before timing out writes of the response.
  write_timeout: 15s

  # Maximum time to wait for the next request on a keep-alive connection.
  idle_timeout: 60s

# Backend servers for load balancing.
# Requests are distributed across backends using round-robin.
#
# Each backend requires:
#   - url: Full URL including scheme (http:// or https://)
#   - name: Unique identifier for logging and dashboards
#
# Optional fields:
#   - weight: Traffic weight for weighted algorithms (default: 1)
#   - max_connections: Max concurrent connections, 0 = unlimited (default: 0)
backends:
  - url: "http://localhost:9001"
    name: "backend-1"
    weight: 1

  - url: "http://localhost:9002"
    name: "backend-2"
    weight: 1

  - url: "http://localhost:9003"
    name: "backend-3"
    weight: 1
