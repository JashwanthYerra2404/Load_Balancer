# Load Balancer Configuration
# ===========================
#
# This is the default configuration for development.
# Production deployments should tune timeouts based on workload characteristics.

server:
  # Port the load balancer listens on.
  port: 8080

  # Maximum duration for reading the entire request, including body.
  read_timeout: 15s

  # Maximum duration before timing out writes of the response.
  write_timeout: 15s

  # Maximum time to wait for the next request on a keep-alive connection.
  idle_timeout: 60s

# Load balancing algorithm.
#
# Supported algorithms:
#   - round_robin:          Equal rotation across all backends (default)
#   - least_connections:    Route to the backend with fewest active connections
#   - weighted_round_robin: Distribute proportionally to backend weights
#   - ip_hash:              Sticky sessions — same client IP goes to same backend
#   - random:               Random healthy backend selection
algorithm: round_robin

# Health check configuration.
#
# The health checker periodically probes each backend to determine if it's healthy.
# Unhealthy backends are automatically removed from the rotation and re-added
# when they recover.
health_check:
  # Time between health check probes.
  interval: 10s

  # Maximum time to wait for a health check response.
  timeout: 5s

  # HTTP path to probe on each backend.
  path: "/health"

  # Number of consecutive failures before marking a backend as dead.
  failure_threshold: 3

  # Number of consecutive successes before marking a recovered backend as alive.
  success_threshold: 1

# Retry configuration.
#
# When a request to a backend fails (connection error or 5xx response),
# the proxy automatically retries with a different backend.
retry:
  # Additional attempts after first failure (total attempts = max_retries + 1).
  max_retries: 2

  # Wait time before first retry. Subsequent retries use exponential backoff.
  initial_backoff: 100ms

  # Maximum backoff cap for exponential backoff.
  max_backoff: 1s

# Circuit breaker configuration.
#
# When a backend accumulates too many failures in a sliding time window,
# the circuit "opens" and all requests are immediately rejected without
# attempting to connect. After a recovery timeout, one probe request is
# allowed through to test if the backend has recovered.
circuit_breaker:
  # Number of failures in the sliding window to trip the circuit.
  failure_threshold: 5

  # Time window for failure counting.
  sliding_window: 60s

  # Time in OPEN state before allowing a probe request (HALF_OPEN).
  recovery_timeout: 30s

# Sticky sessions (cookie-based session affinity).
#
# When enabled, the load balancer injects a cookie that pins a client
# to a specific backend. Subsequent requests with that cookie bypass
# the load balancing algorithm and go directly to the pinned backend.
# The cookie TTL acts as a sliding window — refreshed on every response.
sticky_session:
  # Whether sticky sessions are enabled (default: false).
  enabled: false

  # Name of the affinity cookie.
  cookie_name: "LB_BACKEND"

  # Cookie max-age. Acts as a sliding window of inactivity.
  # 0 = session cookie (expires when browser closes).
  ttl: 1h

  # HttpOnly flag — prevents JavaScript access (XSS protection).
  http_only: true

  # Secure flag — cookie only sent over HTTPS.
  secure: false

# Rate limiting (per-client token bucket).
#
# When enabled, each client IP gets a token bucket admitting requests at a
# sustained rate with a bounded burst. Clients that exceed their limit receive
# 429 Too Many Requests with a Retry-After header. Limits are per-client —
# one abusive client cannot affect others.
rate_limit:
  # Whether rate limiting is enabled (default: false).
  enabled: false

  # Sustained requests per second allowed per client.
  requests_per_second: 100

  # Bucket capacity — the maximum back-to-back burst a client can make
  # after being idle (default: equals requests_per_second).
  burst: 100

# Backend servers for load balancing.
# Requests are distributed across backends using the selected algorithm.
#
# Each backend requires:
#   - url: Full URL including scheme (http:// or https://)
#   - name: Unique identifier for logging and dashboards
#
# Optional fields:
#   - weight: Traffic weight for weighted algorithms (default: 1)
#   - max_connections: Max concurrent connections, 0 = unlimited (default: 0)
backends:
  - url: "http://localhost:9001"
    name: "backend-1"
    weight: 1

  - url: "http://localhost:9002"
    name: "backend-2"
    weight: 1

  - url: "http://localhost:9003"
    name: "backend-3"
    weight: 1
